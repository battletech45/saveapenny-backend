name: Release Image

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Push image to GHCR after build"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build Image
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release context
        id: release-context
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" != "workflow_run" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

          version_tag=""
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in
              v*.*.*)
                version_tag="${tag#v}"
                break
                ;;
            esac
          done
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Print Docker version
        run: docker version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Print Docker Buildx version
        run: docker buildx version

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ steps.release-context.outputs.is_main == 'true' }}
            type=raw,value=${{ steps.release-context.outputs.version_tag }},enable=${{ steps.release-context.outputs.version_tag != '' }}

      - name: Build image without push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write build summary
        if: always()
        run: |
          {
             echo "## Release Image Build"
             echo
             echo "- Ref: \`${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}\`"
             echo "- Event: \`${{ github.event_name }}\`"
             echo "- Publish requested: \`${{ github.event_name == 'workflow_dispatch' && inputs.publish_image || github.event_name != 'workflow_dispatch' }}\`"
             echo "- Image: \`ghcr.io/${{ github.repository }}\`"
             echo "- Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-image:
    name: Publish Image
    needs: build-image
    if: github.event_name == 'workflow_run' || inputs.publish_image == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release context
        id: release-context
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" != "workflow_run" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

          version_tag=""
          for tag in $(git tag --points-at HEAD); do
            case "$tag" in
              v*.*.*)
                version_tag="${tag#v}"
                break
                ;;
            esac
          done
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ steps.release-context.outputs.is_main == 'true' }}
            type=raw,value=${{ steps.release-context.outputs.version_tag }},enable=${{ steps.release-context.outputs.version_tag != '' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write publish summary
        if: always()
        run: |
          {
             echo "## Release Image Publish"
             echo
             echo "- Ref: \`${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}\`"
             echo "- Image: \`ghcr.io/${{ github.repository }}\`"
             echo "- Published tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
