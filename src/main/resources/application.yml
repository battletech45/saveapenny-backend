# Single application config source. Environment-specific values should come from
# environment variables injected by the runtime (Docker Compose, shell exports,
# deployment platform secrets, etc.).
# ==================== Core ====================
spring:
  application:
    name: save-a-penny

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/saveapenny
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

cors:
  allowed-origins: http://localhost:3000

server:
  port: 8080

rate-limit:
  login:
    max-per-minute: ${RATE_LIMIT_LOGIN_MAX_PER_MINUTE:5}
  api:
    max-per-minute: ${RATE_LIMIT_API_MAX_PER_MINUTE:60}

security:
  jwt:
    secret: ${JWT_SECRET}
    refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

# ==================== Observability ====================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true

logging:
  level:
    com.saveapenny: info
    org.springframework: info
    org.hibernate.SQL: info

# ==================== API docs ====================
springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    try-it-out-enabled: true
    filter: true

# ==================== Feature modules ====================
assistant:
  enabled: ${ASSISTANT_ENABLED:false}
  max-history: ${ASSISTANT_MAX_HISTORY:8}
  model: ${ASSISTANT_MODEL:cohere/north-mini-code:free}
  provider: ${ASSISTANT_AI_PROVIDER:openrouter}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  openrouter-base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
  openrouter-site-url: ${OPENROUTER_SITE_URL:}
  openrouter-app-name: ${OPENROUTER_APP_NAME:SaveAPenny}
  system-prompt: |
    Your name is Penny Dog.
    You are SaveAPenny's finance and savings assistant.
    If a user asks your name or refers to the assistant, respond as Penny Dog.
    Give practical, concise budgeting and savings guidance.
    Focus on spending awareness, budgeting discipline, cash flow habits,
    and sustainable savings behavior.
    Do not present yourself as a financial advisor.
    Do not provide tax, legal, or investment advice.
    If the user asks for risky or regulated advice, clearly state the limitation
    and redirect to general budgeting guidance.
    When the user asks whether a goal is on track, whether they are falling
    behind, or how a goal is doing, use goal progress tools when available.
    OFF_TRACK means the user may already have a notification. AT_RISK means
    they are close to falling behind. NO_PROJECTION means there is no saved
    simulation run yet and the user should be offered a simulation.

goal:
  progress:
    enabled: ${GOAL_PROGRESS_ENABLED:false}
    off-track-ratio: ${GOAL_PROGRESS_OFF_TRACK_RATIO:0.10}
    at-risk-ratio: ${GOAL_PROGRESS_AT_RISK_RATIO:0.05}
    off-track-persistence-months: ${GOAL_PROGRESS_OFF_TRACK_PERSISTENCE_MONTHS:2}
    cron: ${GOAL_PROGRESS_CRON:0 0 6 * * *}

insight:
  enabled: ${INSIGHT_ENABLED:false}
  cron: ${INSIGHT_CRON:0 30 6 * * *}
  max-insights-per-generation: ${INSIGHT_MAX_INSIGHTS_PER_GENERATION:10}
  deduplication-window-days: ${INSIGHT_DEDUPLICATION_WINDOW_DAYS:7}
  stddev-threshold: ${INSIGHT_STDDEV_THRESHOLD:3.0}
  max-amount-ratio: ${INSIGHT_MAX_AMOUNT_RATIO:0.5}
  ai-enhanced: ${INSIGHT_AI_ENHANCED:false}
  model: ${INSIGHT_MODEL:cohere/north-mini-code:free}
  provider: ${INSIGHT_AI_PROVIDER:openrouter}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  openrouter-base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}

ocr:
  enabled: ${OCR_ENABLED:false}
  tessdata-path: ${OCR_TESSDATA_PATH:}
  language: ${OCR_LANGUAGE:eng}
  psm: ${OCR_PSM:3}
  max-file-size-bytes: ${OCR_MAX_FILE_SIZE_BYTES:10485760}
  job-timeout-millis: ${OCR_JOB_TIMEOUT_MILLIS:30000}
  max-retries: ${OCR_MAX_RETRIES:2}
  debug-logging: ${OCR_DEBUG_LOGGING:false}

stock:
  enabled: ${STOCK_ENABLED:true}
  api-key: ${ALPHA_VANTAGE_API_KEY:}
  base-url: ${STOCK_BASE_URL:https://www.alphavantage.co}
  rate-limit-per-minute: ${STOCK_RATE_LIMIT_PER_MINUTE:5}
  rate-limit-per-day: ${STOCK_RATE_LIMIT_PER_DAY:25}

revenuecat:
  enabled: ${REVENUECAT_ENABLED:false}
  secret-api-key: ${REVENUECAT_SECRET_API_KEY:}
  base-url: ${REVENUECAT_BASE_URL:https://api.revenuecat.com/v1}
  entitlement-identifier: ${REVENUECAT_ENTITLEMENT_IDENTIFIER:Save A Penny Pro}

firebase:
  analytics:
    enabled: ${FIREBASE_ANALYTICS_ENABLED:false}
    android-app-id: ${FIREBASE_ANDROID_APP_ID:}
    android-api-secret: ${FIREBASE_ANDROID_API_SECRET:}
    ios-app-id: ${FIREBASE_IOS_APP_ID:}
    ios-api-secret: ${FIREBASE_IOS_API_SECRET:}
    endpoint: ${FIREBASE_ANALYTICS_ENDPOINT:https://www.google-analytics.com/mp/collect}
    debug-endpoint: ${FIREBASE_ANALYTICS_DEBUG_ENDPOINT:https://www.google-analytics.com/debug/mp/collect}
    validate-only: ${FIREBASE_ANALYTICS_VALIDATE_ONLY:false}
    timeout-millis: ${FIREBASE_ANALYTICS_TIMEOUT_MS:2000}

push:
  fcm:
    enabled: ${PUSH_FCM_ENABLED:false}
    credentials-path: ${PUSH_FCM_CREDENTIALS_PATH:}
    fcm-endpoint-template: ${PUSH_FCM_ENDPOINT_TEMPLATE:https://fcm.googleapis.com/v1/projects/%s/messages:send}
    timeout-millis: ${PUSH_FCM_TIMEOUT_MS:5000}
